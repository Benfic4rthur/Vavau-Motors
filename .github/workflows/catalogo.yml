name: Atualizar catálogo
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar mesmo sem alterações
        type: boolean
        default: false
      limite:
        description: Máximo de publicações nesta execução
        type: number
        default: 100
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalogo-vavau
  cancel-in-progress: false
jobs:
  atualizar:
    if: github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Ler publicações públicas
        id: sync
        continue-on-error: true
        env:
          SYNC_MAX_POSTS: ${{ inputs.limite || 100 }}
        run: npm run sync
      - name: Resumir e detectar alterações
        id: changes
        if: always()
        env:
          FORCE_PUBLISH: ${{ inputs.publicar || false }}
        run: |
          node scripts/sync-summary.mjs
          if ! git diff --quiet -- data/catalog.json public/catalog-seed.json public/assets || [ -n "$(git ls-files --others --exclude-standard public/assets)" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validar e gerar site quando necessário
        if: steps.changes.outputs.publish == 'true'
        run: |
          npm run check
          npm test
          npm run build:pages
      - name: Salvar catálogo no repositório
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public docs
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catálogo público de motos"
            git push
          fi
      - name: Preparar publicação
        if: steps.changes.outputs.publish == 'true' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
          retention-days: 1
      - name: Publicar catálogo
        id: deploy
        if: steps.changes.outputs.publish == 'true' && vars.PAGES_ENABLED == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Sinalizar falha de sincronização
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'O Instagram não pôde ser lido completamente. O último catálogo válido foi preservado.'
          exit 1
